[project]
name = "genai-challenge-backend"
version = "0.1.0"
description = "GenAI Developer Challenge — RAG API"
requires-python = ">=3.12"
dependencies = [
    # API framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    # Validation & config
    "pydantic>=2.11.0",
    "pydantic-settings>=2.9.0",
    "python-dotenv>=1.1.0",
    # LLM — Ollama via LangChain
    "langchain-ollama>=1.1.0",
    # Text splitting
    "langchain-text-splitters>=1.1.2",
    # Vector DB
    "qdrant-client>=1.15.1,<2.0.0",
    # Embeddings (used directly, not via qdrant-client extra)
    "fastembed>=0.8.0",
    # Document loading
    "pypdf>=5.0.0",
    # HTTP client
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.28.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
